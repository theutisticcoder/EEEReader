<!DOCTYPE html>
<html>
<head>
    <title>EPUB.js Reader</title>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
    <div id="area"></div>
    <input type="file" name="" id="">
    <script>
        document.querySelector("input").onchange = ()=> {
        const book = ePub(document.querySelector("input").files[0]); // Example EPUB
        const rendition = book.renderTo("area", {
            width: "100%",
            height: 600
        });
        rendition.display();
    }
    </script>
</body>
</html>
